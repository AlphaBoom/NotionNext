name: Submit search engine URLs (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      URL: ${{ secrets.URL }}
      BAIDU_TOKEN: ${{ secrets.BAIDU_TOKEN }}
      BING_API_KEY: ${{ secrets.BING_API_KEY }}
    steps:
      - name: Check configuration
        run: |
          if [ -z "$URL" ] || { [ -z "$BAIDU_TOKEN" ] && [ -z "$BING_API_KEY" ]; }; then
            echo "::error::Configure URL and at least one of BAIDU_TOKEN / BING_API_KEY in repository secrets."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install requests
        run: pip install requests
      - name: Submit URLs
        run: |
          if [ -n "$BAIDU_TOKEN" ]; then
            python pushUrl.py --url "$URL" --baidu_token "$BAIDU_TOKEN"
          fi
          if [ -n "$BING_API_KEY" ]; then
            python pushUrl.py --url "$URL" --bing_api_key "$BING_API_KEY"
          fi
